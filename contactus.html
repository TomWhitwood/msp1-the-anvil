<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="The Anvil is a gym where stength, confidence and resilience are shaped through hard work and determination." />
    <meta name="keywords" content="the anvil, gym, sport, exercise, fit" />
    <title>The Anvil | Gym & Fitness Centre</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

    <!-- custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <!-- Navigation -->
    <!-- Navbar copied from Bootstrap -->
    <nav id="navbar" class="navbar navbar-expand-md navbar-expand-lg" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">The Anvil</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="gallery.html">Gallery</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="memberships.html">Memberships</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="contactus.html">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main elemement to hold all key sections of the contact us page -->
    <main>
        <div class="container py-4 py-md-5">
            <div class="row g-3 g-md-4">
                <h1>Contact Us</h1>

                <!-- Left column -->
                <div class="col-12 col-lg-5">
                    <div class="row g-3 g-md-4">

                        <!-- Opening times -->
                        <section class="col-12 col-md-6 col-lg-12" aria-labelledby="hours-heading">
                            <div class="card contact-card h-100">
                                <h2 class="card-header" id="hours-heading">Opening times</h2>
                                <div class="card-body">
                                    <table class="table table-borderless hours-table align-middle">
                                        <tbody>
                                            <tr>
                                                <th scope="row">Monday - Friday</th>
                                                <td>6am - 11pm</td>
                                            </tr>
                                            <tr>
                                                <th scope="row">Saturday - Sunday</th>
                                                <td>7am - 10pm</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </section>

                        <!-- Contact details -->
                        <section class="col-12 col-md-6 col-lg-12" aria-labelledby="details-heading">
                            <div class="card contact-card h-100">
                                <h2 class="card-header" id="details-heading">Get in touch</h2>
                                <div class="card-body">
                                    <dl class="contact-list mb-0">
                                        <dt>Telephone</dt>
                                        <dd><a href="tel:012345678910">01234 5678910</a></dd>
                                        <dt>Email</dt>
                                        <dd><a href="mailto:theanvil@gym.co.uk">theanvil@gym.co.uk</a></dd>
                                    </dl>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <ul id="social-networks">
            <li>
                <a href="https://www.facebook.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Facebook page (opens in a new tab)"><i class="fa-brands fa-facebook"></i></a>
            </li>
            <li>
                <a href="https://www.twitter.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Twitter page (opens in a new tab)"><i
                        class="fa-brands fa-twitter-square"></i></a>
            </li>
            <li>
                <a href="https://www.youtube.com/" target="_blank" rel="noopener"
                    aria-label="Visit our YouTube page (opens in a new tab)"><i
                        class="fa-brands fa-youtube-square"></i></a>
            </li>
            <li>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Instagram page (opens in a new tab)"><i
                        class="fa-brands fa-instagram"></i></a>
            </li>
        </ul>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- Font Awesome kit -->
    <script src="https://kit.fontawesome.com/91238192bb.js" crossorigin="anonymous"></script>
</body>

</html>
