<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore our gallery at The Anvil, showcasing our state-of-the-art facilities, dynamic classes, and the vibrant community that makes our gym a place of strength and inspiration.">
    <title>The Anvil | Gym & Fitness Centre</title>

    <!-- Bootstrap CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<!-- Classes on body set to work with mt-auto on footer to ensure it always stays at the bottom of the page -->
<body class="d-flex flex-column min-vh-100">
    
    <!-- Font Awesome kit -->
    <script src="https://kit.fontawesome.com/91238192bb.js" crossorigin="anonymous"></script>

    <!-- Navigation -->   
    <!-- Navbar copied from Bootstrap -->   
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">The Anvil</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link active" aria-current="page" href="#">Home</a>
        <a class="nav-link" href="#">Gallery</a>
        <a class="nav-link" href="#">Memberships</a>
        <a class="nav-link" href="#">Contact Us</a>
      </div>
    </div>
  </div>
</nav>

    <!-- Header with hero image -->
     <header class="container">
        <div class="row">
            <div class="col-12 col-xl-6">The Anvil</div>
            <div class="col-12 col-xl-6">Hero image</div>
        </div>
     </header>
    
    
    <!-- Main elemement to hold all key sections of the home page. It is not part of the grid structure -->
    <main>
        <!-- Gallery section -->
        <section class="container">
            <div class="row">
                <div class="col-12">Gallery</div>
        </section>
    </main>

    <!-- Footer -->
    <!-- mt-auto added to push footer to the bottom of the page -->
    <footer class="mt-auto">
        <div class="container">
            <div class="row">
               <div class="col-12">Social Media Icons</div> 
            </div>
        </div>
    </footer>
    
</body>
</html>
