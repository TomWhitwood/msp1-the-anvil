<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Anvil enquiry form. Fill in your information and we will get back to you.">
    <meta name="keywords" content="the anvil, gym, sport, exercise, fit, enquire">
    <title>The Anvil | Enquire</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Navigation -->
    <!-- Navbar copied from Bootstrap -->
    <nav id="navbar" class="navbar navbar-expand-md navbar-expand-lg" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">The Anvil</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="gallery.html">Gallery</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="memberships.html">Memberships</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contactus.html">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main elemement to hold all key sections of the enquire page -->
    <main>
        <form id="enquiry-form">
            <h1 style="color: black">Membership Enquiry</h1>

            <label for="first-name">First name</label>
            <input type="text" id="first-name" name="first-name" placeholder="e.g Sam" autocomplete="given-name"
                required>

            <label for="last-name">Last name</label>
            <input type="text" id="last-name" name="last-name" placeholder="e.g. Taylor" autocomplete="family-name"
                required>

            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
            <!-- Pattern and title copied from AI (claude) -->
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" placeholder="e.g 07123 456789" autocomplete="tel"
                pattern="[0-9+\s\-()]{10,15}" title="Please enter a valid phone number (10-15 digits)" required>

            <label for="membership">Membership Type</label>
            <select id="membership" name="membership" required>
                <option value="" disabled selected>Please select...</option>
                <option value="standard">Standard Membership</option>
                <option value="student">Students and Teenagers Membership</option>
                <option value="senior">Senior Membership</option>
                <option value="blue-light">Blue Light Membership</option>
            </select>

            <button type="submit">Submit enquiry</button>
            <!-- Form message copied from AI (claude) as I wanted positive user feedback and was unsure on how to add this -->
            <p id="form-message" role="status" aria-live="polite" hidden></p>
        </form>

        <!-- Button section for navigation to Contact Us -->
        <div id="contactus-button">
            <div class="container text-center">
                <p class="text-muted">Contact us directly if you would like more information</p>

                <!-- Button copied and adjusted from Bootstrap -->
                <a href="contactus.html" class="btn btn-lg btn-outline-dark">Contact Us</a>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <ul id="social-networks">
            <li>
                <a href="https://www.facebook.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Facebook page (opens in a new tab)"><i class="fa-brands fa-facebook"></i></a>
            </li>
            <li>
                <a href="https://www.twitter.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Twitter page (opens in a new tab)"><i
                        class="fa-brands fa-twitter-square"></i></a>
            </li>
            <li>
                <a href="https://www.youtube.com/" target="_blank" rel="noopener"
                    aria-label="Visit our YouTube page (opens in a new tab)"><i
                        class="fa-brands fa-youtube-square"></i></a>
            </li>
            <li>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener"
                    aria-label="Visit our Instagram page (opens in a new tab)"><i
                        class="fa-brands fa-instagram"></i></a>
            </li>
        </ul>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- Font Awesome kit -->
    <script src="https://kit.fontawesome.com/91238192bb.js" crossorigin="anonymous"></script>

    <!-- JavaScript copied from AI (claude) as I wanted a message to pop up after the form had been submitted for positive user feedback and was not sure how to do this -->
    <script>
        const form = document.getElementById("enquiry-form");
        const message = document.getElementById("form-message");

        form.addEventListener("submit", function (event) {
            event.preventDefault(); // stops the page reloading

            const name = document.getElementById("first-name").value;
            message.textContent = "Thank you, " + name + "! Your enquiry has been submitted. We'll be in touch soon.";
            message.hidden = false;

            form.reset(); // clears the fields
        });
    </script>
</body>

</html>
